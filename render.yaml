services:
  - type: worker
    name: 4ever-telegram-bot
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
